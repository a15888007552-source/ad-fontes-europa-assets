name: Cache Europa Wikimedia images

on:
  workflow_dispatch:
    inputs:
      batch_start:
        description: 'First source row index (inclusive)'
        required: true
        default: '180'
      batch_end:
        description: 'Last source row index (exclusive)'
        required: true
        default: '200'
      indexes:
        description: 'Optional comma-separated source row indexes to retry'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cache repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and index Wikimedia images
        env:
          CACHE_BATCH_ONLY: '1'
          CACHE_BATCH_START: ${{ inputs.batch_start }}
          CACHE_BATCH_END: ${{ inputs.batch_end }}
          CACHE_INDEXES: ${{ inputs.indexes }}
        run: python scripts/cache_images.py
      - name: Commit refreshed cache
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json images/poi
          if git diff --cached --quiet; then
            echo 'No cache changes.'
          else
            git commit -m 'europa: refresh static Wikimedia image cache'
            git push
          fi
